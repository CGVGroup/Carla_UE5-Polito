      /permissive[-] Abilita la compilazione di codice non conforme (set di funzionalità soggetto a modifica) (attivo per impostazione predefinita)
      /Ze Abilita le estensioni (predefinita) /Za Disabilita le estensioni
      /ZW Abilita le estensioni del linguaggio WinRT
      /Zs Solo controllo della sintassi       
      /Zc:arg1[,arg2] Conformità al linguaggio C++, i cui argomenti possono essere:
        forScope[-]           Forza l'applicazione di C++ standard per le regole di ambito
        wchar_t[-]            wchar_t è il tipo nativo, non un typedef
        auto[-]               Forza l'applicazione del nuovo significato di C++ standard per auto
        trigraphs[-]          Abilita i trigrammi (disattivato per impostazione predefinita)
        rvalueCast[-]         Forza l'applicazione delle regole di conversione del tipo esplicito di C++ standard
        strictStrings[-]      Disabilita il valore letterale stringa nella conversione [char|wchar_t]*
                              (disattivato per impostazione predefinita)
        implicitNoexcept[-]   Abilita noexcept implicito su funzioni obbligatorie
        threadSafeInit[-]     Abilita l'inizializzazione statica locale thread-safe
        inline[-]             Rimuove la funzione o i dati senza riferimento se è COMDAT
                              o include un solo collegamento interno (disattivato per impostazione predefinita)
        sizedDealloc[-]       abilita le funzioni di deallocazione dimensionata
                              globali di C++14 (attivato per impostazione predefinita)
        throwingNew[-]        Presuppone la generazione dell'operatore new in caso di errore (disattivato per impostazione predefinita)
        referenceBinding[-]   Non consente il binding di un elemento temporaneo a
                              un riferimento lvalue non costante (disattivato per impostazione predefinita)
        twoPhase-             Disabilita la ricerca del nome in due fasi
        ternary[-]            Forza l'applicazione delle regole di C++11 per l'operatore condizionale (disattivato per impostazione predefinita)
        noexceptTypes[-]      Forza l'applicazione delle regole noexcept di C++17 (attive per impostazione predefinita in C++17 o versioni successive)
        alignedNew[-]         Abilita l'allineamento di oggetti allocati dinamicamente per C++17 (attivato per impostazione predefinita)
        hiddenFriend[-]       impone regole friend nascoste C++ standard (rese implicite da /permissive-)
        externC[-]            impone regole C++ standard per funzioni 'extern "C"' (rese implicite da /permissive-)
        lambda[-]             per un miglior supporto delle funzioni lambda, usare il processore lambda più recente (disattivato per impostazione predefinita)
        tlsGuards[-]          genera i controlli di runtime per l'inizializzazione delle variabili TLS (attivato per impostazione predefinita)
        zeroSizeArrayNew[-]   chiama il membro new/delete per matrici di oggetti di dimensione 0 (attivo per impostazione predefinita)
        static_assert[-] gestione strict di 'static_assert' (implicita da /permissive-)
        gotoScope[-]          non può superare l'inizializzazione di una variabile (implicita in /permissive-)
        templateScope[-] applica le regole di shadowing dei parametri del modello C++ Standard
        enumTypes[-]          abilita i tipi di enumerazione sottostanti C++ Standard (disattivato per impostazione predefinita)
        checkGwOdr[-]         applica le violazioni di una regola di definizione C++ Standard
                              quando /Gw è stato abilitato (disattivato per impostazione predefinita)
        __STDC__              definisci __STDC__ a 1 in C
      /await Abilita l'estensione per funzioni ripristinabili
      /await:strict Abilita il supporto per coroutine C++20 standard con versioni precedenti del linguaggio
      /constexpr:depth <N>     Limite di profondità di ricorsione per la valutazione di constexpr (impostazione predefinita: 512)
      /constexpr:backtrace<N> mostra N valutazioni di constexpr nella diagnostica (impostazione predefinita: 10)
      /constexpr:steps<N>     termina la valutazione di constexpr dopo N incrementi (impostazione predefinita: 100000)
      /Zi Abilita le informazioni di debug    
      /Z7 Abilita informazioni di debug in stile meno recente
      /Zo[-] Genera informazioni di debug più complete per il codice ottimizzato (attivato per impostazione predefinita)
      /ZH:[MD5|SHA1|SHA_256] algoritmo hash per il calcolo del checksum del file nelle informazioni di debug (impostazione predefinita: SHA_256)
      /Zp[n] Comprime gli struct allineandoli su un limite di n byte
      /Zl Omette il nome della libreria predefinita in OBJ
      /vd{0|1|2} Abilita/disabilita vtordisp  /vm<x> Tipo di puntatori a membri
      /std:<c11|c17> versione standard di C
          c11 - ISO/IEC 9899:2011
          c17 - ISO/IEC 9899:2018
      /ZI Abilita le informazioni di debug di Modifica e continuazione
      /openmp Abilita le estensioni del linguaggio OpenMP 2.0
      /openmp:experimental abilita le estensioni del linguaggio OpenMP 2.0 ed estensioni del linguaggio OpenMP 3.0+ selezionate
      /openmp:llvm Estensioni del linguaggio OpenMP che usano il runtime di LLVM
      
                                    -VARIE-
      
      @<file> Opzioni dei file di risposta    
      /?, /help Visualizza questo argomento della Guida
      /bigobj Genera il formato di oggetto esteso
      /c Solo compilazione, nessun collegamento
      /errorReport:opzione Deprecata. Segnala a Microsoft gli errori interni del compilatore
          none Non invia la segnalazione                
          prompt Richiede l'invio immediato della segnalazione
          queue Al successivo accesso di amministratore, richiede l'invio della segnalazione (impostazione predefinita) 
          send Invia la segnalazione automaticamente         
      /FC Utilizza i percorsi completi nella diagnostica
      /H<num> Lunghezza massima dei nomi esterni
      Il tipo char predefinito /J è unsigned  
      /MP[n] Utilizza fino a 'n' processi per la compilazione
      /nologo Non visualizza le informazioni sul copyright
      /showIncludes Visualizza i nomi dei file di inclusione
      /Tc<file di origine> Compila il file come file .c
      /Tp<source file> Compila il file come .cpp
      /TC Compila tutti i file come file .c   /TP Compila tutti i file come file .cpp
      /V<string> Imposta la stringa di versione
      /Yc[file] Crea un file PCH              
      /Yd Inserisce informazioni di debug in ogni OBJ
      /Yl[sym] Inserisce riferimenti PCH per la libreria di debug
      /Yu[file] Usa il file PCH               /Y- Disabilita tutte le opzioni PCH
      /Zm<n> Massima allocazione di memoria (% del valore predefinito)
      /FS forza l'utilizzo di MSPDBSRV.EXE    
      /source-charset:<nome-iana>|.nnnn consente di impostare il set di caratteri di origine
      /execution-charset:<nome-iana>|.nnnn consente di impostare il set di caratteri di esecuzione
      /utf-8 consente di impostare il set di caratteri di origine e quello di esecuzione su UTF-8
      /validate-charset[-] convalida i file UTF-8 solo per i caratteri validi
      /fastfail[-] abilita la modalità fast-fail
      /JMC[-] abilita Just My Code nativo     
      /presetPadding [-] aggiunta di zero per l'inizializzazione dei tipi di classe basati su stack
      /volatileMetadata[-] Genera metadati sugli accessi alla memoria volatile
      /sourcelink [file] file contenente informazioni sul collegamento di origine
      
                                      - COLLEGAMENTO -
      
      /LD Crea un file .DLL                   /LDd Crea un libreria di debug .DLL
      /LN Crea un .netmodule                  
      /F<numero> Imposta la dimensione dello stack
      /link [librerie e opzioni del linker]   
      /MD Effettua il collegamento con MSVCRT.LIB
      /MT Effettua il collegamento con LIBCMT.LIB
      /MDd Effettua il collegamento con la libreria di debug MSVCRTD.LIB
      /MTd Effettua il collegamento con la libreria di debug LIBCMTD.LIB
      
                                    -CODE ANALYSIS-
      
      /analyze[-] Abilita l'analisi nativa    
      /analyze:quiet[-] Nessun avviso sulla console
      /analyze:log<nome> Avvisi nel file      /analyze:autolog Accesso a *.pftlog
      /analyze:autolog:ext<ext> Accesso a *.<ext>
      /analyze:autolog- Nessun file di log    /analyze:WX- Avvisi non irreversibili
      /analyze:stacksize<numero> Numero massimo di stack frame
      /analyze:max_paths<numero> Numero massimo di percorsi
      /analyze:only Analisi, nessuna generazione codice
      
                                    -DIAGNOSTICA-
      
      /diagnostics:<args,...> Controlla il formato dei messaggi di diagnostica:
                   classic   - Mantiene il formato precedente
                   column[-] - Stampa le informazioni sulle colonne
                   caret[-]  - Stampa la colonna e la riga di codice indicata
      /Wall Abilita tutti gli avvisi          /w   Disabilita tutti gli avvisi
      /W<n> Imposta il livello di avviso (valore predefinito n=1)
      /Wv:xx[.yy[.zzzzz]] disabilita gli avvisi introdotti dopo la versione xx.yy.zzzzz
      /WX Considera gli avvisi come errori    
      /WL Abilita le informazioni di diagnostica su una sola riga
      /wd<n> Disabilita l'avviso n            
      /we<n> Considera l'avviso n come un errore
      /wo<n> Riporta l'avviso n una sola volta
      /w<l><n> Imposta il livello di avviso 1-4 per n
      /external:I <percorso>      - Percorso delle intestazioni esterne
      /external:env:<var>     - Variabile di ambiente con percorsi delle intestazioni esterne
      /external:anglebrackets - Considera come esterne tutte le intestazioni incluse tramite <>
      /external:W<n>          - Livello di avviso per le intestazioni esterne
      /external:templates[-]  - Valuta il livello di avviso nella catena di creazione di un'istanza dei modelli
      /sdl abilita ulteriori avvisi e funzionalità di sicurezza
      /options:strict le opzioni non riconosciute del compilatore sono un errore
      
