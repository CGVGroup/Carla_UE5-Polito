                               OPZIONI DEL COMPILATORE C/C++
      
      
                                    -OTTIMIZZAZIONE-
      
      Numero massimo di ottimizzazioni /O1 (priorità allo spazio)
      Numero massimo di ottimizzazioni /O2 (priorità alla velocità)
      /Ob<n> Espansione inline (n predefinito=0)
      /Od Disabilita le operazioni di ottimizzazione (predefinita)
      /Og Abilita l'ottimizzazione globale    /Oi[-] Abilita le funzioni intrinseche
      /Os Ottimizza lo spazio del codice      /Ot Ottimizza la velocità del codice
      Ottimizzazioni /Ox (priorità alla velocità)
      /favor:<blend|AMD64|INTEL64|ATOM> seleziona il processore per cui effettuare l'ottimizzazione. Scegliere una delle seguenti opzioni:
          blend Combinazione di ottimizzazioni per più processori x64 diversi
          AMD64 Processori AMD a 64 bit                                 
          INTEL64 Processori con architettura Intel(R)64                  
          ATOM - processori Intel(R) Atom(TM)                           
      
                                   -GENERAZIONE DEL CODICE-
      
      /Gu[-] assicura che funzioni distinte abbiano indirizzi distinti
      /Gw[-] separa le variabili globali per il linker
      /GF Abilita la condivisione delle stringhe in sola lettura
      /Gm[-] Abilita la ricompilazione minima /Gy[-] Separa le funzioni per il linker
      /GS[-] Abilita i controlli di sicurezza /GR[-] Abilita RTTI di C++
      /GX[-] Abilita EH (equivalente a /EHsc) di C++
      /guard:cf[-] Abilita CFG (guard flusso di controllo)
      /guard:ehcont[-] Abilita i metadati di continuazione EH (CET)
      /EHs Abilita EH (senza eccezioni SEH) di C++
      /EHa Abilita EH (con eccezioni SEH) di C++
      /EHc Usa nothrow come impostazione predefinita di extern "C"
      /EHr Genera sempre verifiche di terminazione del runtime noexcept
      /fp:<contract|except[-]|fast|precise|strict> scegliere il modello a virgola mobile:
          contratto: prendere in considerazione le contrazioni a virgola mobile durante la generazione del codice
          except[-] Considera le eccezioni di virgola mobile durante la generazione del codice
          fast Modello a virgola mobile "fast"; i risultati sono meno prevedibili
          precise Modello a virgola mobile "precise"; i risultati sono prevedibili
          strict Modello a virgola mobile "strict" (implica /fp:except)
      /Qfast_transcendentals Genera intrinseci FP inline anche con /fp:except
      /Qspectre[-] Abilita le mitigazioni per CVE 2017-5753
      /Qpar[-] Abilita la generazione di codice parallelo
      /Qpar-report:1 diagnostica parallelizzazione automatica; indica i cicli parallelizzati
      /Qpar-report:2 diagnostica parallelizzazione automatica; indica i cicli non parallelizzati
      /Qvec-report:1 diagnostica vettorizzazione automatica; indica i cicli vettorizzati
      /Qvec-report:2 diagnostica vettorizzazione automatica; indica i cicli non vettorizzati
      /GL[-] Abilita la generazione di codice in fase di collegamento
      /volatile:<iso|ms> Scegliere il modello volatile:
          iso - Semantica acquisisci/rilascia non garantita per accesso volatile
          ms - Semantica acquisisci/rilascia garantita per accesso volatile
      /GA Ottimizza per l'applicazione Windows
      /Ge Impone il controllo dello stack per tutte le funzioni
      /Gs[numero] Controlla le chiamate di verifica dello stack
      /Gh Abilita la chiamata di funzione _penter
      /GH Abilita la chiamata di funzione _pexit
      /GT Genera accessi TLS indipendenti da fiber
      /RTC1 Abilita i controlli rapidi (/RTCsu)
      /RTCc Converte in controlli di tipo più limitato
      /RTCs Verifica runtime dello stack frame
      /RTCu Controlli di utilizzo locale non inizializzati
      /clr[:opzione] Compila per Common Language Runtime, dove opzione è:
          pure: produce un file di output solo IL (senza codice eseguibile nativo)
          safe: produce un file di output verificabile solo IL
          netcore: produce assembly destinati al runtime di .NET Core
          noAssembly: non produce alcun assembly
          nostdlib: ignora la directory di sistema di .NET Framework durante la ricerca di assembly
          nostdimport: non importa in modo implicito gli assembly obbligatori
          initialAppDomain: abilita il comportamento AppDomain iniziale di Visual C++ 2002
          implicitKeepAlive: disattiva la creazione implicita di System::GC::KeepAlive(this)
      /fsanitize=address Abilita la generazione del codice con AddressSanitizer
      /homeparams Impone la scrittura nello stack dei parametri passati nei registri
      /GZ Abilita i controlli dello stack (/RTCs)
      /Gv Convenzione di chiamata __vectorcall
      /arch:<AVX|AVX2|AVX512> - Requisiti minimi dell'architettura della CPU. Scegliere una delle opzioni seguenti:
         AVX - Consente di usare le istruzioni disponibili con le CPU abilitate per AVX
         AVX2 - Consente di usare le istruzioni disponibili con le CPU abilitate per AVX2
         AVX512 - Consente di usare le istruzioni disponibili con le CPU abilitate per AVX-512
      /QIntel-jcc-erratum Abilita le mitigazioni per l'errore JCC Intel
      /Qspectre-load Abilita le mitigazioni Spectre per tutte le istruzioni che caricano memoria
      /Qspectre-load Abilita le mitigazioni Spectre per tutte le istruzioni del flusso di controllo che caricano memoria
      /Qspectre-jmp[-] Abilita le mitigazioni spectre per le istruzioni di salto non condizionali
      /fpcvt:<IA|BC> compatibilità per la conversione da virgola mobile a intero senza segno
         IA - risultati compatibili con l'istruzione VCVTTSD2USI
         BC - risultati compatibili con il compilatore di VS2017 e versioni precedenti
      
